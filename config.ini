; Settings for redhat_automation.py
; Keep this file private - it holds the Adv Pro login.

[excel]
path = \\192.168.0.129\test\Exam count\redhat exam 2026.xlsx
; a copy of the Excel file is saved here before every write
backup_dir = backups

[chrome]
path = C:\Program Files\Google\Chrome\Application\chrome.exe
; port the script uses to control Chrome (same as the Pearson VUE script)
debug_port = 9222

[redhat]
url = https://rhtapps.redhat.com/individualexamscheduler/#/AdmManageEligibilities
; Desktop shortcut whose Chrome profile is used
shortcut = Advantage pro - Chrome.lnk
status = Completed
time_zone = Asia/Calcutta
; searched one after the other, in this order
locations = 2093, 2337, 2394
; kiosk table at the top: every exam of the day is counted - the Completed search
; above, plus these statuses (comma-separated)
kiosk_statuses = Scheduled

[feedback]
; used by feedback_from_sheet.py
; "ADV PRO FEEDBACK (Responses)" Google Sheet. Leave blank to pick it in Google Drive.
sheet_url = https://docs.google.com/spreadsheets/d/1UxSa6JL57BOaxRlZgSOoOBMpBTDVd7bAe-tRqwYe0OQ/edit?gid=621806997#gid=621806997
drive_url = https://drive.google.com/drive/u/0/home
; Desktop shortcut whose Chrome profile is used (advpromktg@gmail.com)
shortcut = Ranjit - Chrome.lnk
; Leave blank to auto-detect (tries month/day and day/month). Example: %d/%m/%Y
timestamp_format =

[linkedin]
; used by linkedin_from_outlook.py
; Desktop shortcut whose Chrome profile is used (Outlook is signed in there)
shortcut = Arish - Chrome.lnk
outlook_url = https://outlook.live.com/mail/
; after Outlook: Google "<name> @ <company> linkedin profile" for the ones still not found,
; open the first LinkedIn profile and keep it only if the name and company match (yes/no)
google_search = yes
; no company in the sheet: search by name + place; kept only when the name matches exactly,
;   the profile is in one of google_locations, and only ONE profile has that name
google_no_company = yes
google_locations = chennai, tamil nadu, tamilnadu
; seconds between two Google searches (too fast and Google asks "I'm not a robot")
google_delay = 8
; used by company_from_linkedin.py: people who gave no feedback -> open their LinkedIn id and
; take the current company + role into Company Name / Designation (yes/no)
profile_lookup = yes
; seconds between two LinkedIn profiles
profile_delay = 5

[advpro]
exe = C:\Users\ADV PRO\Desktop\Adv Pro.exe
username = vetri
password = veegee
; seconds to wait for the Registration list after typing a phone number
search_wait = 2

[review]
; used by google_reviews.py: Google reviews of the last 24 hours -> "Google Review" y + Remark
; Desktop shortcut whose Chrome profile is used
shortcut = Advantage pro - Chrome.lnk
; what is searched on Google to find the business
search = advantagepro.in
; Google Maps link of the business (saved here automatically the first time)
maps_url = https://www.google.com/maps?cid=7757309297969550129&hl=en
; hours to look back
hours = 24
; reviews by these names are skipped (the business's own account), comma-separated
skip_reviewers = Advantage pro
; a review can also match a candidate of this many days before the date (late reviewers)
match_days = 7

[catchup]
; before the date itself, the days before it are checked: a step not finished there
; (logs\progress_<date>.json) is done first. 0 = off
days = 7
